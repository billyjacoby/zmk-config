# SPI for trackball
CONFIG_SPI=y
CONFIG_INPUT=y

# Pointing device support
CONFIG_ZMK_POINTING=y

# PMW3610 driver
CONFIG_PMW3610=y

# Inversions (match your original settings)
CONFIG_PMW3610_INVERT_X=y
CONFIG_PMW3610_INVERT_Y=y

# Smart algorithm for surface tracking
CONFIG_PMW3610_SMART_ALGORITHM=y

# External power (for trackball)
CONFIG_ZMK_EXT_POWER=y

# Report rate limiter for BLE (replaces old polling rate setting)
CONFIG_ZMK_INPUT_PROCESSOR_REPORT_RATE_LIMIT=y
