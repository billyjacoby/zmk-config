# SPI for trackball
CONFIG_SPI=y
CONFIG_INPUT=y

# Pointing device support
CONFIG_ZMK_POINTING=y

# PMW3610 driver (badjeff's alt driver)
CONFIG_PMW3610_ALT=y

# Inversions (use Kconfig since DT properties may not work)
CONFIG_PMW3610_ALT_INVERT_X=y
CONFIG_PMW3610_ALT_INVERT_Y=y

# External power (for trackball)
CONFIG_ZMK_EXT_POWER=y
